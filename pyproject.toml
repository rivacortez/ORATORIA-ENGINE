[project]
name = "oratoria-evidence-engine"
version = "0.1.0"
description = "OratorIA Multimodal Evidence Engine - API-first service producing verbatim transcripts and auditable multimodal evidence for single-speaker presentations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "aioboto3>=13.2",
    "structlog>=24.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-aioboto3>=13.2",
]

[project.scripts]
evidence-engine = "evidence_engine.bootstrap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_engine"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # no print
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",
]
ignore = [
    # FastAPI's Depends() in a default is the framework idiom, not a mutable
    # default.
    "B008",
    # Exception names carry the spec's vocabulary rather than an `Error`
    # suffix: `ProhibitedLabel`, `FabricatedValue`, `ConsentViolation` name the
    # rule that was broken, which is what a reader needs from a domain error.
    # `DomainError` is the base, so the family is still identifiable, and
    # `FabricatedValueError` would add a syllable while subtracting meaning.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["evidence_engine"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []
mypy_path = "src"
packages = ["evidence_engine"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires postgres/redis/object storage",
    "contract: validates the published REST/WebSocket contract",
    "invariant: guards a rule whose violation invalidates the service",
]

[tool.coverage.run]
source = ["src/evidence_engine"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
