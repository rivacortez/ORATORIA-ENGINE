[project]
name = "oratoria-evidence-engine"
version = "0.1.0"
description = "OratorIA Multimodal Evidence Engine - API-first service producing verbatim transcripts and auditable multimodal evidence for single-speaker presentations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# **Empty, and that is the point.**
#
# `domain/` imports nothing but the standard library and `application/`
# imports no third party at all - C2 and C3 have enforced that since the
# project started. What was never enforced was the *distribution*: the base
# dependency list carried FastAPI, SQLAlchemy, asyncpg, Redis, aioboto3 and
# OpenTelemetry, so `pip install oratoria-evidence-engine` installed a server
# and its whole infrastructure stack to get at a package that needs neither.
#
# A consumer embedding the engine - the case ADR-001 exists for - was paying
# for a web framework and a database driver to read a taxonomy. Now the core
# installs alone and every runtime concern is opt-in. C9 checks this against
# the built wheel rather than against this file, because a dependency can be
# declared correctly here and still be dragged in transitively.
dependencies = []

[project.optional-dependencies]
# The hosted service: REST, WebSocket, PostgreSQL, Redis, object storage,
# telemetry. Everything that makes the engine a *deployment* rather than a
# library. `evidence_engine.bootstrap` refuses to import without it and says
# so (see `evidence_engine._extras`).
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "aioboto3>=13.2",
    "structlog>=24.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]
# Local inference: the pinned research baseline running on the consumer's own
# hardware. Renamed from `managed`, which said nothing about what it loads -
# see `RuntimeMode` for why that name did damage.
#
# torch is NOT here, and must not be. The wheel index depends on the card
# - this project's workstation is a Blackwell (sm_120) and needs cu130 - and
# `uv sync --extra local` would resolve the CPU build from PyPI and silently
# replace a working CUDA install. That has happened on this machine. Install
# torch first, from the index your card needs, then this extra.
local = [
    "transformers==4.57.6",
    "accelerate>=0.26",
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
]
# Corpus construction, annotation and agreement. Deliberately empty: the whole
# of `src/corpus` imports nothing but the standard library, which is worth
# knowing rather than worth hiding. Declared anyway so the install line is
# stable when the evaluation work needs a statistics package.
research = []
# Recording a presentation from a microphone, for the pilot and for anybody
# who wants to hear what the engine hears.
record = [
    "sounddevice>=0.4",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # httpx2, not httpx: starlette.testclient warns that the httpx 0.x
    # backend is deprecated. Kept alongside because other packages still
    # resolve `httpx`.
    "httpx>=0.28",
    "httpx2>=2.12",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-aioboto3>=13.2",
]

[project.scripts]
evidence-engine = "evidence_engine.bootstrap.cli:main"
corpus = "corpus.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `corpus` ships alongside the service package but is never imported by
# it (contract C8). Included so the CLI is installable for annotators.
packages = ["src/evidence_engine", "src/corpus"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # no print
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",
]
ignore = [
    # FastAPI's Depends() in a default is the framework idiom, not a mutable
    # default.
    "B008",
    # Exception names carry the spec's vocabulary rather than an `Error`
    # suffix: `ProhibitedLabel`, `FabricatedValue`, `ConsentViolation` name the
    # rule that was broken, which is what a reader needs from a domain error.
    # `DomainError` is the base, so the family is still identifiable, and
    # `FabricatedValueError` would add a syllable while subtracting meaning.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# T201 forbids `print` because a service that prints instead of emitting
# structured telemetry loses its output. A command line is the one place
# where stdout *is* the interface.
"src/corpus/cli/*" = ["T201"]
# Same reason: this one writes the Pilot A rehearsal transcript, which is piped
# straight into a committed evidence file. Structured telemetry from it would
# have nowhere to go.
"scripts/_pilot_a_checks.py" = ["T201"]
# The presentation runner. Its whole output is a report a person reads at a
# terminal; there is nowhere else for it to go.
"scripts/present.py" = ["T201"]
# The operator command line. It prints a key the operator has to copy and a
# configuration snapshot they have to read; routing either through structured
# telemetry would put them in a log the person running the command never sees.
"src/evidence_engine/bootstrap/cli.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["evidence_engine", "corpus"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []
mypy_path = "src"
packages = ["evidence_engine", "corpus"]

[[tool.mypy.overrides]]
# The local runtime's stack. An optional extra rather than a dependency - the
# core installs with nothing at all - so mypy will not
# find them in the default environment and must not fail the gate for it. The
# adapter imports them inside a function and re-raises with an install command,
# which is the behaviour these overrides exist to permit.
module = ["torch.*", "transformers.*", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
# Warnings are errors. A suite that prints two warnings prints twenty within a
# year, and the twenty-first is the one that mattered. The single exemption
# below is scoped to the exact message and the module that emits it, so it
# stops applying the moment that module is fixed.
filterwarnings = [
    "error",
    # starlette 1.6.0 annotates against `anyio.abc.BlockingPortal`, which anyio
    # 4.15 deprecated in favour of `anyio.from_thread.BlockingPortal`. Emitted
    # at import time from inside starlette; there is no version of it that does
    # not, and nothing in this repository can change it. Pinning anyio back to
    # hide it would be downgrading a dependency to silence a third-party
    # annotation, which trades a real risk for a cosmetic one.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "integration: requires postgres/redis/object storage",
    "contract: validates the published REST/WebSocket contract",
    "invariant: guards a rule whose violation invalidates the service",
    # C9. Builds a wheel and creates a virtual environment, so it costs
    # seconds rather than milliseconds. Deselect it locally with
    # `-m "not distribution"`; the evidence battery runs it, because the
    # claim it defends is one of the two ADR-001 rests on.
    "distribution: builds and installs the wheel in a clean environment",
]

[tool.coverage.run]
source = ["src/evidence_engine", "src/corpus"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
