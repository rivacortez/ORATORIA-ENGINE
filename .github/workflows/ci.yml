name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The battery runs against the memory backend and the deterministic
  # runtimes. Phase 2's exit criterion is defined "without model inference"
  # precisely so that it can be checked on every commit rather than only where
  # Postgres, Redis, MinIO and a GPU all happen to be available.
  ENGINE_BACKEND: memory
  ENGINE_RUNTIME_MODE: deterministic
  # Test-only values. Real secrets come from the secret manager (spec 15.2) and
  # never from a workflow file.
  ENGINE_API_KEY_PEPPER: ci-pepper-value-at-least-32-characters
  ENGINE_STREAM_TOKEN_SIGNING_KEY: ci-signing-key-at-least-32-characters
  PYTHONIOENCODING: utf-8

jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Types
        run: mypy

      - name: Architecture
        # Six contracts, each guarding a claim the spec makes about the shape
        # of the system. A broken one means the claim is no longer true.
        run: lint-imports

      - name: Tests
        # NFR-021 asks for 80% branch coverage on the deterministic logic in
        # the domain and application layers. The gate is set at 88 because the
        # suite currently sits at 90: a gate at the requirement lets coverage
        # decay ten points before anyone hears about it. Adapters are covered
        # by the contract and integration suites rather than by this gate, and
        # model quality is validated through benchmarks, not code coverage.
        run: |
          pytest \
            --cov=evidence_engine.domain \
            --cov=evidence_engine.application \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=88

      - name: Phase 2 exit criterion
        # Called out as its own step so a failure names the phase it blocks
        # rather than appearing as one red dot among a hundred.
        run: pytest tests/contract -q

  integration:
    # The persistent adapters, against the real thing. Separate from `battery`
    # because it needs infrastructure, and because a failure here means
    # something different: the contracts still hold, but an adapter does not
    # implement them. The three bugs this job exists to catch - a missing
    # foreign-key parent, a partial unique index violated by flush ordering,
    # and missing object-store credentials - were all invisible in memory.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: engine
          POSTGRES_PASSWORD: engine
          POSTGRES_DB: engine
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U engine -d engine"
          --health-interval 2s --health-timeout 3s --health-retries 30

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: engine
          MINIO_ROOT_PASSWORD: engine-secret
          MINIO_DEFAULT_BUCKETS: evidence-engine
        ports: ["9000:9000"]

    env:
      ENGINE_TEST_DATABASE_URL: postgresql+asyncpg://engine:engine@localhost:5432/engine
      ENGINE_TEST_REDIS_URL: redis://localhost:6379/1
      ENGINE_TEST_S3_ENDPOINT: http://localhost:9000
      ENGINE_TEST_S3_ACCESS_KEY: engine
      ENGINE_TEST_S3_SECRET_KEY: engine-secret

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv pip install --system -e ".[dev]"

      - name: Migrate
        # Running the migration here rather than creating tables from the
        # models is deliberate: this is the only place the migration is
        # exercised end to end before a deployment relies on it.
        env:
          ENGINE_DATABASE_URL: postgresql+asyncpg://engine:engine@localhost:5432/engine
        run: alembic upgrade head

      - name: Migration round-trip
        # up -> down -> up. A migration that cannot be reversed is a deployment
        # that cannot be rolled back, and the first time that matters is the
        # worst time to discover it.
        env:
          ENGINE_DATABASE_URL: postgresql+asyncpg://engine:engine@localhost:5432/engine
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Integration tests
        run: pytest -m integration
