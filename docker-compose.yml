# Local infrastructure for the persistent backend.
#
# The contract suite does not need any of this - phase 2's exit criterion is
# defined without infrastructure so it runs on every commit. This is for the
# integration tests, which check that the PostgreSQL, Redis and S3 adapters
# behave like the in-memory ones the contracts were written against.
#
#   docker compose up -d
#   ENGINE_DATABASE_URL=postgresql+asyncpg://engine:engine@localhost:5432/engine \
#   uv run alembic upgrade head
#   uv run pytest -m integration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: engine
      POSTGRES_DB: engine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The integration suite waits on this rather than sleeping: a fixed sleep
      # is either too short on a cold start or wasted on a warm one.
      test: ["CMD-SHELL", "pg_isready -U engine -d engine"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # `--appendonly no`: everything Redis holds here is ephemeral by design
    # (leases, quota windows, stream snapshots). Persisting it would preserve
    # state whose whole contract is that it expires.
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: engine
      MINIO_ROOT_PASSWORD: engine-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-bucket:
    # Creates the bucket once and exits. A one-shot job rather than a step in
    # the application's startup: an application that creates its own bucket
    # needs credentials that can create buckets, which is far more authority
    # than it needs to read and write objects.
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 engine engine-secret &&
      mc mb --ignore-existing local/evidence-engine &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
  minio-data:
